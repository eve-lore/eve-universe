content:
- body: "![Generals](//images.ctfassets.net/1gqwxa4vbed9/6FJCQiB4RjJM7QGkNtzMUV/b1657ad0617879490d8563230aa25a2b/image-20260625-134449.png)\n\nNegotiations
    among CONCORD\u2019s Inner Circle are still continuing after almost three weeks
    of sessions. Following the end of the Warpath conflict, the details of CONCORD\u2019s
    continued role and the specifics of the Yulai Accords have become a matter of
    debate between the four major factions.\n\nDiplomatic meetings have been taking
    place behind closed doors in the neutral ground of AIR\u2019s Trade Center in
    Manifest, Exordium. There are rumors from those inside the various diplomatic
    camps that these discussions have spiraled to include the amendment, or even repealing,
    of some articles of the Yulai Accords. Whatever the truth of the matter may be,
    it is certain that there is no end in sight as the powers of New Eden continue
    to struggle to find common diplomatic ground.\n\nWhile debate rages, the four
    major factions have not been shy to act. Each has called on capsuleers to assist
    their militaries in ambitious infrastructure projects. As these projects fall
    under military jurisdiction, they have been dubbed \u201CMilitary Campaigns\u201D.
    They are believed to be attempts by the factions to consolidate their power in
    preparation for future escalations in their respective conflicts. The campaigns
    have been broken down into smaller objectives that, if completed, will aid in
    their attempts to achieve their larger goals.\n\nThe Caldari State has achieved
    by far the greatest success in this new organizational endeavor. The CEP has ordered
    the Caldari Navy to work with capsuleers to dismantle the Intaki Syndicate, making
    way for a new long-range stargate pair linking Ienakkamon to T-LIWS in Syndicate.
    Enthusiasm for the project has been widespread. Six objectives have been completed
    so far, with as many as 7,542 capsuleers providing their maximum possible contribution
    to a single objective. This level of dedication has made it possible for them
    to complete objectives with unmatched speed, completing a single objective in
    as little as four hours. The project is being overseen by Executive General Heika
    Torigo, who calls the Caldari\u2019s dedication \u201Cexpected,\u201D adding that
    \u201Dour people know the meaning of duty.\u201D\n\nThe other three factions have
    all had similar success to one another, each achieving two objectives so far.
    The Amarr Empire is using its military might to clear a path for sweeping economic
    reform. This will include the construction of a Deaconry of Commerce that will
    oversee what Empress Catiz I has dubbed \u201CThe Blessed Exchange\u201D. Amarr
    pilots have shown high levels of dedication, despite having over a thousand fewer
    capsuleers join their cause than their Minmatar rivals. Despite these incredible
    efforts, many Amarr pilots have abandoned counterintelligence objectives as they
    face off against suspected Republic Security Services agents in High Security
    Bulwark systems. Captain Marshal Sirdan xer Qosh has stated that \u201Cwe cannot
    allow Republic forces to continue to corrupt our sacred intelligence.\u201D\n\nMeanwhile,
    the Minmatar Republic aims to restore the Starkmanir tribe to their historic home
    in the Amarr-controlled system of Arzad. Once the powerful peacemakers of the
    pre-occupation Minmatar, the Starkmanir were all but wiped out by the Amarr. Now
    the Minmatar hope that capsuleers can assist them in achieving the impossible,
    the reclamation of Starkman Prime, aka Arzard II. Project leader, Hetman General
    Kanth Filmir, has called the effort a \u201Clong-awaited reckoning for our people.\u201D
    The Minmatar progress has been a result of a broad community of capsuleers. While
    they show less individual dedication than their Amarr counterparts, they have
    remained in step so far thanks to their superior numbers.\n\nThe Gallente Federation
    faced the most troubled start of any campaign with their Operation Rogue Edge.
    An ambitious research project envisioned by their new President, Alix Moreau,
    the project aims to support groundbreaking research into Rogue Drones with the
    hopes of unlocking new technological insights. However, their early objectives
    were disrupted when a Sansha Incursion attacked key Federation systems. \n\nEventually,
    the incursion was defeated, and 2189 capsuleers managed to achieve maximum contribution
    levels, creating a path for the Federation to be on par with the Minmatar and
    Amarr. Vice Admiral Foriana Revelli celebrated the victory but added, \u201CThis
    must be only the beginning. The Caldari are racing ahead, and we still have a
    lot of ground to cover. I know that the citizens of our Federation will step up
    and make the President\u2019s bold dream a reality.\u201D\n\n## News in Brief\n-
    CONCORD confirms Warpath perpetrator still unidentified.\n\n- Militia Monday\u2019s
    Warzone parade destroys hostile Phoenix Navy Issue.\n\n- Mordu\u2019s Legion patents
    new groundtroop armor prototypes.\n\n- Black Rise Regional News publishes editorial
    welcoming Exordium newcomers, inviting them to fight alongside Caldari.\n\n- AEGIS
    command redirects EDENCOM funds to black budget research projects in partnership
    with Upwell.\n\n- Federation loyalists \u201CBlaster Boys\u201D publish unsanctioned
    Scope footage of anti-Caldari efforts.\n\n- Alliance Sedition lose Metenox in
    Akkio after a 3-hour engagement that saw 850 Billion ISK lost.\n\n- Mass data
    transfers reported in Zarzakh, followed by Deathless agent deployment inside Fulcrum.\n\n-
    Exordium opening celebrations hailed as success by AIR CEO, with celebrating Titans
    joined by rare capsuleer vessels, including Armageddon Imperial Issue."
