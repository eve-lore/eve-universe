content:
- body: "![syndicateCaldariNavy](//images.ctfassets.net/1gqwxa4vbed9/1gAUeUUS5aEHaLG2qH8Vw2/97537ed54acea8a008ff6921911113de/syndicateCaldariNavy.png)\n\nThanks
    to the efforts of capsuleers backing the State Corridor campaign, organizations
    within Syndicate have signed an agreement to further Caldari State governance.
    The acceptance of State rule has cleared the way for the finalization of the stargate
    link between Ienakkamon in Black Rise and T-LIWS in Syndicate. \n\n16,828 capsuleers
    have contributed to the State Corridor campaign. Executive General Heika Torigo,
    who oversaw the campaign, has praised their support for \u201Cstrengthening the
    Caldari\u2019s peacekeeping efforts in Syndicate and providing key construction
    resources.\u201D The campaign resources are also being used to fund meritocratic
    advancement programs for Syndicate natives. Thousands of Syndicate residents have
    already applied to these special programs that grant a wide range of opportunities
    to step onto the corporate ladder of the Caldari\u2019s eight ruling megacorporations.
    \n\nIntaki Bank CEO Auboguier Falinnuse has praised these programs, saying \u201Cwe
    have already begun partnering with the 8 megas to establish executive training
    programs that will help foster expertise and Caldari relations amongst our management
    teams.\u201D The Intaki Bank has also met with the Caldari Business Tribunal to
    determine what \u201Cappropriate policies look like for the unique challenge Syndicate
    faces\u201D. The Intaki Bank has a history of client anonymity that has often
    led to accusations that it is a safe haven for illegal finances. Despite this,
    it is a respected institution and is even a member of the Upwell Consortium. The
    details of its agreements with the Caldari Business Tribunal have not been disclosed,
    but it is expected that they have found a working agreement that allows them to
    continue operating with the same privacy rules for clients. What the Caldari State
    is getting in return for this agreement remains to be seen.\n\nThe State\u2019s
    successes have not eradicated lawlessness from the region. While much of the corruption
    within the Intaki Syndicate has been purged, criminal elements within the region
    are deeply entrenched. Syndicate also remains outside the reach of CONCORD, meaning
    that joint efforts between the Intaki Space Police and the Caldari Navy remain
    the only law enforcement within the region.\n\nThere is also the matter of Silphy
    en Diabel. At the top of the Caldari\u2019s most wanted list, she remains at large.
    Since escaping confinement on New Caldari months ago, there has been no sign of
    the once-celebrated leader of the Syndicate. Many in the region believe they have
    been abandoned by their former leader. One such individual is the Chief of Intaki
    Space Police, Ruerjocetan Vinaere. \u201CWe all thought Silphy was our savior\u201D,
    Vinaere told the Scope. \u201CI could never have imagined she was using us as
    a cover for these cruel acts of terrorism. Now we have a chance for a more honorable
    path, thanks to the Caldari.\u201D \n\nNot all of en Diabel\u2019s former supporters
    have been so quick to disavow her. Many of her known associates are currently
    being held by the Caldari Navy, with others believed to have fled to join Serpentis
    or the Guristas Pirates. \u201CRats will always find a hole to run to\u201D Torigo
    announced when asked about these loyalists. \u201CBut there is nowhere they can
    flee that we will not find them.\u201D\n\n### News in Brief\n- Upwell Consortium
    deploys emergency Ansiblex update. More on this story as it unfolds.\n\n- SOCT
    cancels hyperdimensional science conference with attendees already en route.\n\n-
    Intaki Bank to provide banking services to Modern Finances at their Depository
    in T-LIWS.\n\n- Reports of shifts in Anoikis and \u201Cphantom\u201D messages
    from unknown source.\n\n- Blood Raider shipyard activity spikes as Sani Sabik
    worshippers gather for commencement of Crimson Harvest.\n\n- Empress calls on
    all faithful to support Blessed Exchange as campaign enters final week.\n\n- Intaki
    Commerce launches new self-regulation program in hopes of avoiding State intervention.\n\n-
    Kybernauts prepare for sixth totality day despite irregular abyssal energies observed
    inside Pochven."
