- body: "![Amarr Jubilee Fireworks](//images.ctfassets.net/1gqwxa4vbed9/163qaXvO79XujbFRDNsEFR/7492dd94b52361c53672ca8b55d29776/Amarr_Jubilee_Fireworks.png)\n*Faithful
    capsuleers celebrate the Empress\u2019 Jubilee in Amarr.*\n\nEmpress Catiz I has
    celebrated her tenth year on the throne by proclaiming an Imperial Edict instituting
    her Blessed Exchange plan for economic reform. Rapturous celebrations were held
    across the Empire, with the Empress herself addressing crowds on the planet of
    Amarr. \u201CThere is no blessing greater than to be your Empress,\u201D she told
    the millions who had gathered before the Imperial Palace, \u201Cand as your Empress
    I lay before you a path to a more perfect exchange within the glory of our faith.\u201D\n\nThough
    the Empress' Edicts are uncontestable law, the radical nature of the planned reform
    required a great deal of resources, coordination, and political goodwill to ensure
    that its rollout would be smooth and to give it a chance of success. It was for
    this reason that the Amarr organized a capsuleer campaign around the planned change.
    Without their groundwork, the chaos of such a drastic change could have resulted
    in severe civil unrest. The Empress took the time to thank all who had supported
    the campaign: \u201CMay the Lord\u2019s light shine on all those who have worked
    so tirelessly to lay the foundations for our brighter tomorrow.\u201D\n\n The
    details of the Blessed Exchange reforms will simultaneously increase the rigidity
    of the Imperial hierarchy while also allowing for much freer trade within the
    Empire. Taxes, fines, and other regulatory charges have been standardized based
    on territorial control. The economic rationalization of Imperial authority based
    on territory by itself would be relatively punishing to the commoners, with benefits
    increasing significantly for those further up the Imperial hierarchy. However,
    restrictions on trade have been reduced, and the wealth it generates is handled
    separately from these territorial charges. This means that commoners, for the
    first time, have the real possibility of earning significant wealth from specialist
    craft skills or merchant enterprises.\n\nThe edict also stipulates changes to
    the control of military forces. More power and authority will be granted to local
    holders, along with the ability to request Imperial Navy support to resolve local
    conflicts. In exchange, the updated tax requirements include stipulations for
    high-performing members of the holder\u2019s military staff to be submitted for
    reassignment to the Imperial Navy. Captain Marshal Sirdan xer Qosh, who oversaw
    the Blessed Exchange\u2019s campaign efforts, has called these changes \u201Cthe
    greatest boost to Imperial security in my lifetime.\u201D Greater local autonomy
    is expected to help holders deal with local conflicts, especially along the borders
    of the Empire where Imperial Authority is the weakest. The reassignment clause
    will ensure that the Imperial Navy remains the ultimate force within the Empire
    despite the increased power to local holders. Military analysts suspect that this
    measure is included to quell any theoretical delusions of rebellion.\n\n### News
    in Brief\n- CONCORD negotiations in Exordium put on hold for emergency Inner Circle
    session.\n\n- Evidence of Anoikis' \u201CPhantom Whisperer\u201D fuels precursor
    conspiracy theories.\n\n- Capsuleers honor Empress' 10th anniversary with parade
    in Amarr.\n\n- Blood Raider maneuvers observed as Crimson Harvest approaches.\n\n-
    Empire\u2019s chicest holders attend Jubilee gala at Excubitoris Chapterhouse,
    Amarr VIII.\n\n- Artists honor Empress with sacred portraiture.\n\n- Pochven insiders
    report increased communication traffic amongst Triglavian forces.\n\n- Caldari
    State welcomes influx of Syndicate tourism thanks to \u201CDMZ\u201D festivities.\n\n-
    Over a trillion ISK in ships destroyed in Eifer dread brawl.\n\n- Avatar, Nyx,
    and Vehement among ships destroyed in Amamake solar rotation celebration."
