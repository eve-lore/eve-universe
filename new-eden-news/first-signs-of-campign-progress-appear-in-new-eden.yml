content:
- body: "![T-LIWS construction](//images.ctfassets.net/1gqwxa4vbed9/6dThVznWgnSzg8qpcUkNG7/f7921fe2c782cb69bbce94e568b9fefc/T-LIWS_construction.png)\n*State
    Corridor Construction Site in T-LIWS*\n\nThe first signs of Military Campaign
    progress have begun to appear in Caldari and Gallente space. The Caldari have
    begun construction on their \u201CState Corridor\u201D, while the Federation\u2019s
    \u201COperation Rogue Edge\u201D has begun to bear fruit.\n\nThe Caldari State
    continues to outperform the other major factions with 12 campaign objectives completed
    so far. Two new sites have sprung up in Ienakkamon and another in T-LIWS as construction
    commences on their State Corridor Stargate.\n\nThe State Corridor Initiative is
    a bold stargate construction project, but its completion is reliant on the Caldari\u2019s
    ability to expunge the Intaki Syndicate\u2019s influence over the Syndicate region.
    Executive General Heika Torigo has been leading their efforts to root out the
    Syndicate, the State having declared the organization a criminal entity when its
    occupation of the region began. \n\nThe Intaki Assembly on Intaki Prime has raised
    concerns over the Caldari Navy\u2019s policing of the region. As Syndicate is
    a null-security region outside the reach of CONCORD\u2019s DED, there has been
    little oversight of the State's actions. Torigo has been quick to assure the public
    that the State is \u201Cacting with honor and respect in this endeavor,\u201D
    adding that \u201Cthe Intaki are being manipulated; these concerns are Federation
    propaganda masked as humanitarianism.\u201D\n\nThe Federation Navy\u2019s primary
    concern has been its own campaign. Vice Admiral Foriana Revelli has praised capsuleers
    for the Federation\u2019s progress on Operation Rogue Edge, telling members of
    the press that \u201Cour citizens are what make us the greatest democracy the
    cluster has ever seen. Despite the hordes of Sansha authoritarianism that slowed
    our early progress, we are now hot on the State\u2019s tail, all thanks to the
    people of this Federation.\u201D\n\nThe Federation is following close behind the
    State with 10 objectives completed in their grand research project, Rogue Edge.
    Using Rogue Drone innovations to supercharge their industrial infrastructure has
    allowed the Gallente to begin work on a new stargate construction site in Renyn.
    Potential endpoints are being surveyed, and should the operation be successful,
    the Federation will have the industrial power they need to complete the longer
    route to Jufvitte. If not, a site in Ellmay has been selected as a backup.\n\nThe
    Minmatar Republic is not far behind the Federation, with 8 of its own objectives
    completed, its plan to reclaim the planet currently known as Arzad II for the
    Starkmanir seems to be on course. The Amarr Empire, however, is languishing in
    fourth place with only 5 objectives completed so far. There are concerns that
    the Empress' plan for economic reforms has failed to gain sufficient support from
    the capsuleers of New Eden. If she cannot inspire greater support, then the project
    could become a cluster-wide embarrassment.\n\n### News in Brief\n- Provost Marshal
    Kasiha Valkanir denies \u201CAEGIS Nemesis funding conspiracies\u201D, condemning
    \u201CVanguard collaborators\u201D.\n\n- Amamake hosts capsuleer clash as hundreds
    celebrate anniversary of Dirt 'n' Glitter's formation. \n\n- Gallente capsuleer
    loyalists sponsor Pioneer construction to boost support of Federation\u2019s campaign
    objectives.\n\n- Freeport magnate Bluemelon scouting for new location, capsuleers
    promote Essence region for consideration.\n\n- CONCORD negotiations continue with
    no end in sight as major powers continue to clash.\n\n- Upwell Consortium blames
    reports quarterly drop in earnings on Vanguard raids.\n\n- TEST Alliance claims
    new sovereignty, expanding into Pure Blind.\n\n- Doomsdays unleash massive destruction
    as Brawl over Metenox in Ravarin escalates to Titan combat.\n\n- SOCT denies open
    research groups request for access to secrets of hyperspace tracking.\n\n- CONCORD
    issues travel advisory for Uedama in response to spike in capsuleer violence within
    system."
