content:
- body: "![starkRestoration](//images.ctfassets.net/1gqwxa4vbed9/5YlfWQ5pSeOHZKAafbhDft/bb6a0485e4f9ddf04c9d09fba3c35dba/starkRestoration.png)\n\n###
    Starkmanir Restoration Succeeds\nThe Minmatar Republic\u2019s Starkman Restoration
    has been declared a success following an agreement signed by four of the five
    members of CONCORD\u2019s Inner Circle. The agreement recognizes the system currently
    known as Arzad and neighboring Ezzara as the Minmatar Republic\u2019s sovereign
    space. In addition, the legal process has begun to rename Arzad to Starkman, and
    the planet Arzad II to Starkman Prime. Both changes will follow a formal handover
    in November of YC128.\n\n13,772 capsuleers contributed to the campaign's success,
    bolstering the resources and diplomatic standing of the Starkmanir tribe while
    demonstrating the Republic\u2019s military strength in the low-security warzone.
    Hetman General Kanth Filmir, who led the campaign, has praised these capsuleers
    as \u201Cbastions of our heritage.\u201D He called the campaign\u2019s success
    the \u201Crighting of one of our cluster\u2019s greatest wrongs.\u201D\n\nThe
    Starkmanir, a tribe almost completely wiped out by the Amarr, have led celebrations
    in their granted territories on Matar. For months, hopeful settlers have gathered
    in Amo where they eagerly await the opportunity to return to their historic home.
    Arzad II/Starkman Prime was rendered nearly uninhabitable by the bombardment that
    wiped out its original Starkmanir inhabitants centuries ago, and the only known
    inhabitants are a small community of Republic outcasts living in a settlement
    known as Vo'Shun. The reaction of that population to the Republic's sovereignty
    is unknown at this time. \n\nMany of the resources gathered by the Starkmanir
    Restoration campaign will be used to assist the settlers in their relocation.
    Extensive heat shielding, water production facilities, soil enrichment, and air
    purification are but a few of the projects that will be essential to creating
    a sizeable self-sustaining colony. Starkmanir Chief Jeoran Setul has called on
    his people to embrace the challenge, putting out a message to any hesitant Starkmanir
    saying, \u201CThe work will be hard, but we have known harder. This world is ours,
    and through our care it will one day bloom again.\u201D\n\nAmong those excited
    to return to Starkman Prime are special archaeological teams from the Republic
    University. University Chancellor Aranda Otewlf spoke to the Scope on behalf of
    the University: \u201CThe early Starkmanir were the first among equals in the
    united tribes of Matar and held extensive records about our culture. They led
    by example when they settled on Starkman Prime, showing that our future lay beyond
    the bounds of one world. They were advanced settlers and astronomers with deep
    insights into nearby star systems. Their artifacts can teach us a great deal about
    how the cosmic environment has changed over the centuries.\u201D Minmatar industrial
    enterprises are especially interested in how this research may improve Phased
    Field detection, further driving the Republic\u2019s current economic boom.\n\n###
    Amarr Empire Downplays Changes\n\nThe Amarr were unsurprisingly the only members
    of CONCORD\u2019s Inner Circle to vote against the Starkman motion, but have accepted
    the Circle\u2019s agreement. Empress Catiz I herself spoke on the matter, claiming
    that \u201Cthis is a purely symbolic victory for the Minmatar; it changes nothing.
    The Imperial Navy and the capsuleers of the 24th Imperial Crusade occupy both
    Arzad and Ezzara. Let these civilian settlers cling to their barren rock; the
    heavens are still filled with the hymns of the Amarr.\u201D\n\nThe Amarr Empire
    has agreed to allow the Starkmanir settlers and their escorts through unmolested
    should they still hold occupancy on the date of repatriation. However, with tensions
    running high there are concerns for the colonists' safety. \n\nSanmatar Maleatu
    Shakor challenged the Empress' comments, saying, \u201CThey call the heavens their
    destiny, but they are our legacy. We return to the first place outside Matar that
    our people called home, and we restore a tribe that the Empire tried to take from
    us. Our strength can never be erased.\u201D\n\n### News in Brief\n\n- Royal Heirs
    in attendance at last day of Alliance Tournament XXII Preliminaries.\n\n- Final
    16 Alliance Tournament teams prepare for championship matches on the 31st of October
    and 1st of November.\n\n- AIR CEO Elida Balashirian joins EverMore\u2019s Alexander
    Ducasse and Manifest IRIS in Exordium promotional event.\n\n- Intaki Space Police
    welcome new culture of discipline following joint training exercises with Caldari
    Navy.\n\n- Class-action lawsuit filed against Upwell Consortium by families of
    those lost to Hollow Clone incident last year.\n\n- Academics flood into Geminate
    to discuss irregular data with Society of Conscious Thought.\n\n- Nefantar hold
    \u201Ccharitable day of service\u201D in honor of Starkmanir Restoration.\n\n-
    Empirical-theologians' higher-dimensional communications research classified following
    peer review by Royal Amarr Institute.\n\n- Amarr Civil Service prepares for reorganization
    as Empress Catiz I oversees modernization efforts."
