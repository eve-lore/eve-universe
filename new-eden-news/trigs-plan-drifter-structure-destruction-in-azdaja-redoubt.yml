content:
- body: "![AzdajaDrifterStructure](//images.ctfassets.net/1gqwxa4vbed9/16BInaeEhNT5AIGllJwyzx/dc810e3b34aaf614cf02f8a3570821a0/AzdajaDrifterStructure.png)\nA
    message from the Triglavian Collective is being shared across all of New Eden
    via clandestine back channels. The message calls for the support of Kybernauts,
    which is believed to refer to those non-Triglavians who are loyal to the Collective.
    Their participation is requested against a surprising target: the unidentified
    Drifter Nexus structure in Azdaja Redoubt:\n\n> *The Ancient Enemy Azdazja construct
    has revealed recurring-time insights. Koschoi, unshackled in a forbidden dominance
    arrangement, animate a mockery of reverse-time Azdazja. Their corruption results
    in recurring-time movement against the Flow of Vyraj. Counter-flow influence now-time
    transitions the Construct from witness to burden.*\n\n> *Stability of Pochven
    lystopad cycle is interrupted by counter-flow influence. Extirpation of the construct
    is uspevat. Extirpation of the construct is now-time inevitable within the flow.
    All Kybernauts who would prove their direction must converge for participation
    in advanced-time inevitability.*\n\n> *Advanced-time coordinates in Ancient Domain
    configuration:*\n> __*YC128.11.05 19:00, Counter Domain in Azdaja Redoubt.*__\n\nThe
    message comes as the Blood Raiders' Crimson Harvest invasion of Pochven begins
    to draw to a close. This invasion was possible due to a shift in the stability
    of Pochven\u2019s Abyssal energies. Though the Triglavians\u2019 message is characteristically
    enigmatic, it is believed to suggest some kind of connection between the targeted
    Drifter structure and the recent instability.\n\nThe structure is one of five
    of its kind, with one existing in each of the Drifter wormhole systems. All of
    these structures were recovered from the Drifter Nexus in their respective systems
    following the events of the Drifter Crisis. For years prior to that Crisis, they
    had appeared as scattered pillars, only coalescing into their current shape as
    the Crisis approached its finale. At that time, they became active, though their
    exact function remains a matter of conjecture.\n\nSince the Crisis' end, the structures
    have been dormant. Despite that, they have been the focus of extensive research
    programs by the occupying factions. This includes them being key to the recently
    discovered Conquest technology. It is unclear why the Triglavians would choose
    to destroy such a valuable asset. \n\nThe Society of Conscious Thought, leading
    experts on Drifter and Jovian technology, were approached by the Scope for comment.
    Though the Society is known to run extensive Abyssal observation programs, they
    have yet to respond. AEGIS command has issued a statement on behalf of EDENCOM,
    which also controls a Drifter Nexus structure in the system of Sentinel MZ. In
    the statement, they called the planned destruction \u201Ca thoughtless act of
    revenge. The Triglavians\u2019 rivalry with the Jovians and Drifters is well documented.
    It is clear that the Collective has allowed its hatred to override its dedication
    to so-called \u2018fitness\u2019.\u201D\n\nOthers have suggested that this conclusion
    may have been reached too hastily. A research group headed up by anthropologists
    from universities within all four empires has been studying the Triglavians in
    Pochven. They released a statement to the Scope stating that \u201Cthe Triglavians\u2019
    actions suggest that greater caution should be applied to any future Drifter research\u201D.
    According to these anthropologists, \u201Cthe Triglavian culture is a truly ancient
    one. They have access to technologies and knowledge that the rest of New Eden
    either lost millennia ago or never had. We believe it would be unwise to continue
    to invest in Drifter research without first understanding the Triglavians' actions.\u201D\n\n###
    News in Brief\n\n- Capsuleers across New Eden engage in vigils following the passing
    of the Boldest Captain.\n\n- Empress Catiz I honors Deteriorated after they claim
    victory over Dracarys in the Alliance Tournament XXII final.\n\n- Massive Imperium
    forces mobilize to strike against multiple low-sec capsuleer structures.\n\n-
    Sitareh Lex holds Conquest symposium on Osiris in Amarr.\n\n- EDENCOM accuses
    Scope of irresponsible reporting on Triglavian message, while Provost Marshal
    Kasiha Valkanir is unavailable for comment.\n\n- Concerns raised as Federation
    rumored to be experimenting with Rogue infestation technology.\n\n- Upwell Consortium
    members report stabilizing finances one month after Dimensional Shift."
