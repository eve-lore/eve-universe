- body: "### The Scope - Strike on the Azdaja Redoubt Drifter Nexus Structure\n<iframe
    width=\"2545\" height=\"1136\" src=\"https://www.youtube.com/embed/zBl0YW8icac?list=PLQvKSs1k6DLND_n1eyjHLML_0G__CEqMg\"
    title=\"The Scope | Strike on the Azdaja Redoubt Drifter Nexus Structure\" frameborder=\"0\"
    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;
    picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\"
    allowfullscreen></iframe>\n\n*A message from the Triglavian Collective was shared
    across all of New Eden via clandestine back channels. The message called for support
    of Kybernauts, which is believed to refer to non-Triglavians loyal to the Collective.
    Their participation was requested against a surprising target: the unidentified
    Drifter Nexus structure in Azdaja Redoubt. This is a condensed version of the
    live scope broadcast covering that event; the full-length version can be found
    [here](https://www.twitch.tv/videos/2920435247)*\n\n![NexusDestroyed](//images.ctfassets.net/1gqwxa4vbed9/3sfWtbOjIjm1OQjAm1uFVO/86aa90db9c1c281d3ab006719292b761/NexusDestroyed.png)\n\n###
    Empires Search For Emergent Artifact\n\nThe destruction of the Drifter Nexus structure
    in Azdaja Redoubt has sent shockwaves through hyperspace. Hyperspace Observatories
    predict the emergence of an unknown Drifter artifact somewhere in New Eden as
    a result. The nature of this \u201CEmergent Artifact\u201D remains unclear, but
    it is having an outsized impact on the Drifter Hyperspace network as it begins
    to collapse into lower dimensions of space.\n\nMass mobilizations by the four
    major factions\u2019 military forces are underway as they scramble to be the first
    to discover and control the Emergent Artifact once it appears. Research programs,
    industrial operations, and violent conflict are all expected outcomes as the empires
    scramble to claim control over this expanding technological landscape. The race
    for Drifter tech supremacy is underway, with each one pushing its own unique application
    of that technology. Whatever their goal, capturing the Emergent Artifact could
    offer the successful faction a significant edge over the other empires. With Conquest
    technology restricted, these advantages could tip the delicate balance between
    the four powers.\n\nThe Gallente Federation alone finds itself in a particularly
    difficult situation as it lacks the Drifter wormhole system access necessary to
    take advantage of this new technological frontier. Despite this, any new insights
    for them could mean a new path to challenging Conquest technology. President Moreau
    has come under criticism for increasingly risky investments in Rogue Drone research
    as they try to find a way to close this technological gap.\n\n### Crimson Harvest
    Ends With Tetrimon Victory\n\nThe Crimson Harvest has come to an end, and reports
    in Pochven suggest that stability has returned to the region. The Blood Raiders
    were unable to secure a permanent foothold in the region, while the Order of St.
    Tetrimon, thanks to capsuleer support, was successful in their efforts to force
    the Triglavians to abandon minor victory systems in Amarr space. During the Harvest,
    56% of all capsuleer efforts were dedicated to the Order, a record high compared
    to previous Harvests.\n\n![CHResults](//images.ctfassets.net/1gqwxa4vbed9/3rvV75dywOrHAAMMhJARbf/29dbf710f2da30fcc1ac87f5cd545b3a/CHResults.png)\n\nGrand
    Master Khemon Dulsur an-Tetrimon, leader of the Order, released an address to
    the Amarr Empire in which he stated, \u201CThough we may not agree on the details,
    we all stand in service to the Lord. Let none doubt that it is the Lord\u2019s
    will that faith rules the heavens. It is by their own rule of proving that the
    Triglavians have been forced to accept that faith should rule supreme over our
    skies. For that we can all rejoice.\u201D \n\nExperts in Triglavian anthropology
    have responded to the statement, calling it a mischaracterisation of the cultural
    concept of Cladalistic Proving and denying any implications that the Collective
    recognises the primacy of the Amarr faith. Despite this, Grand Master an-Tetrimon\u2019s
    words were celebrated across the Empire as the Triglavian forces retreated back
    into the Abyss.\n\n![Sentinel MZ Baldur](//images.ctfassets.net/1gqwxa4vbed9/1mqvCJWCbi9k8sijDoqGdp/79d7c32c669ef9628fe7cd8d664b0e26/Sentinel_MZ_Baldur.png)\n###
    Kasiha Valkanir Removed From AEGIS\nKasiha Valkanir has been relieved of her command
    and honorably discharged from AEGIS. The reason for the former Provost Marshal\u2019s
    dismissal was not disclosed, and the records of recent meetings between Valkanir
    and an EDENCOM oversight committee have been sealed. \n\nIn an official statement,
    AEGIS has thanked Valkanir for her service, saying that \u201Cher strength held
    us together during the darkest days of the Triglavian Invasion,\u201D but concluded
    with \u201Cunfortunately her vision for the future of the organization is no longer
    in line with our remit.\u201D\n\nThe announcement went on to confirm that Inspector
    Major Baldur Chaiya will replace Valkanir and has been promoted to Provost Marshal
    effective immediately. Chaiya began his military career with the Republic Fleet,
    where he established an exemplary service record. During the Triglavian Invasion,
    he was one of the first to volunteer for EDENCOM and received numerous commendations
    throughout that conflict. During the Drifter Crisis, Chaiya was appointed to oversee
    counter-Drifter operations, including the occupation of the Drifter wormhole now
    known as Sentinel MZ.\n\nKasiha Valkanir has so far been unavailable for comment.\n\n###
    News in Brief\n- Empress Catiz I guest of honor as Deaconry of Economic Oversight
    readies to launch.\n\n- AIR announces new free ship program based in Exordium.\n\n-
    Synchronization technology released as faction tensions grow.\n\n- CONCORD and
    AIR unveil joint effort to improve capsuleer piloting HUD.\n\n- Rogue Drone tech
    first construction project a success as Jufvitte stargate completed.\n\n- AIR
    to relaunch Career Program on integrated Achievements platform.\n\n- Political
    pundits call new navy attack battlecruisers bad sign for de-escalation of conflict.\n\n-
    Starkmanir tribe readies to open its first station above Starkman Prime.\n\n-
    Reports of Rogue Drone infestations across Federation research sites.\n\n- Newly
    dubbed State Syndicate reveals rename plans to Caldari megacorp execs in T-LIWS."
