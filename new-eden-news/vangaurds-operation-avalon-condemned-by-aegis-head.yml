- body: "![Avalon Sighting](//images.ctfassets.net/1gqwxa4vbed9/1VmG03jlq1jrCNhFsYonYt/897e290b678c3b67bb51e26cf23df51c/Character_Selection_Background_2117x1200-20260701-113025.png)\n##
    Operation Avalon Disrupts Upwell Interests\n\nThe Upwell Consortium has reported
    a new wave of raids on their planetary assets by Vanguard warclones. According
    to data packets intercepted by Upwell security teams, these raids are part of
    a Vanguard-led initiative called \u201COperation Avalon.\u201D\n\nThe attacks
    come weeks after unverified reports that the Vanguard have broken ties with the
    Deathless Circle, along with the associated mercenaries of Arkombine. The Deathless
    were instrumental in the reinbodiment of the infomorph minds that make up the
    Vanguard and have been using the group as their own private army. What led to
    this schism is unclear, but the Vanguard\u2019s departure is believed to have
    been less than amicable and involved the theft of an under-construction Forward
    Operating Base (FOB). \n\nThe location of the stolen FOB remains unknown, but
    the Scope has received reports of a rogue flotilla of Arkombine carriers. The
    flotilla seems to be constantly on the move, with representatives turning up across
    New Eden while Vanguard operatives carry out their raids on Upwell infrastructure.\n\nAccording
    to Mordu\u2019s Legion, who provide security services to Upwell, the goal of Operation
    Avalon is the theft of assets and gathering of wealth in order to retrofit the
    Vanguard\u2019s stolen FOB, which the Vanguard have renamed the Avalon. The Legion
    has been quick to respond with the deployment of improved ground response teams.
    \n\nAccording to Muryia Mordu, founder of the Legion, \u201COur elite specialists
    have been specifically trained to deal with the Vanguard threat. These warclones
    may have broken their association with the Deathless Circle, but that seems to
    only have deepened their commitment to vandalism. We will protect Upwell\u2019s
    assets; you can count on that.\u201D\n\n![Provost Marshal Kasiha Valkanir](//images.ctfassets.net/1gqwxa4vbed9/6bgXtsUK4a4HjRdDxzKyrk/6d821c84dace78eeea50476bb070c059/image-20260707-085151.png)\n##
    AEGIS Head Calls Out CONCORD Over Vanguard\nProvost Marshal Kasiha Valkanir has
    criticized CONCORD for failing to step in and deal with the Vanguard. The head
    of AEGIS, EDENCOM\u2019s command group, Valkanir, was appointed by CONCORD. CONCORD
    has largely stayed out of the conflicts between Upwell and the Vanguard, allowing
    the mercenaries of Mordu's Legion to handle the response. \n\nValkanir has called
    this approach \u201Cunacceptable.\u201D According to her, \u201Cthe Vanguard represent
    the most advanced form of a decade-long existential crisis for our cluster. Unlike
    the capsuleers who preceded them, these warclones have proven themselves to be
    a menace. This latest variant has a twisted obsession with a doctrine they call
    \u201Cresonance\u201D, a process by which they violate the \u2018one body, one
    mind\u2019 precedent that is amongst our civilization's most fundamental principles.\u201D\n\nAEGIS
    was placed at the head of EDENCOM in YC121 in order to lead New Eden\u2019s defense
    against the Triglavian Invasion. Despite this AEGIS and the wider EDENCOM forces
    maintain separate command structures, as EDENCOM is made up of forces provided
    by the four major empires, while AEGIS is a largely autonomous group formed by
    CONCORD. \n\nOfficers from the wider EDENCOM forces were unwilling to speak on
    the record in either support or condemnation of Valkanir\u2019s comments. Nor
    were they willing to comment on reports that AEGIS has siphoned significant funding
    into a black budget line item with no oversight from the Empires, CONCORD, nor
    visibility to the wider EDENCOM forces.\n\nThe four empires have so far officially
    maintained a similar stance to CONCORD towards the Vanguard. However, Upwell claims
    the secret services of these four empires have been funding Vanguard operations
    in return for tactical intel and strategic advantages.\n\n## News in Brief\n-
    Caldari report success on multiple fronts as they continue clamp down on Syndicate
    agents.\n\n- Rumors swirl of Moros sighted mining in Intaki system, dubbed \u201CMoisanught\u201D.\n\n-
    Vice Admiral Foriana Revelli meets with CreoDron to discuss future improvements
    to military drone infrastructure.\n\n- Rare tournament prizes Raiju and Cybele
    destroyed in recent combats.\n\n- Empress Catiz\u2019s plan for Blessed Exchange
    fails to gain traction with faithful capsuleers.\n\n- Capsuleer community rallies
    around new pilot supporter Mike Azariah following ship loss en route to Exordium.\n\n-
    Hetman General Kanth Filmir thanks capsuleers for help dismantling multiple Cartel
    operations.\n\n- Republic prepares for Liberation Day celebrations, including
    art exhibitions and war zone raids."
