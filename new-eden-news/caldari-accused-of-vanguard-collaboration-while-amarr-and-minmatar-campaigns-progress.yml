content:
- body: "![Avalon Flotilla amateur](//images.ctfassets.net/1gqwxa4vbed9/BXaLb1IkwYU0jHb6XU9DZ/6add7a220c896c74a3bde20649f884d9/Avalon_Flotilla_amateur.png)\n*Unconfirmed
    sighting of Avalon Flotilla taken by an anonymous amateur source.*\n\n### Caldari
    Accused of Harboring Avalon Flotilla\nThe Caldari State has been accused of harboring
    the Vanguard Avalon Flotilla within its borders. The accusations were made by
    AEGIS' Provost Marshal Kasiha Valkanir. According to Valkanir, \u201CRaids were
    carried out by capsuleers on AEGIS facilities across the cluster during the Vanguard\u2019s
    recent Operation Avalon. Stolen assets from those raids have been discovered across
    the cluster, but by far the largest number have been traced to Caldari space.\n\n\u201CAEGIS
    is gathering evidence that clandestine elements within the State encouraged capsuleers
    to collaborate with these criminal warclones. The State\u2019s House of Records
    has blocked AEGIS from investigating further. The Vanguard are a dangerous and
    criminal group, and blocking our legitimate investigation into that group seems
    tantamount to an admission of collaboration.\u201D\n\nChairman Akimaka Saraki,
    head of the Caldari State\u2019s ruling Chief Executive Panel, has denied any
    knowledge of a connection between the State and Vanguard warclones. Isilionen
    Huomaila, CEO of the House of Records, claims that AEGIS' request to investigate
    was dismissed because \u201Cit lacks sufficient material grounds\u201D and that
    Valkanir\u2019s comments are \u201Cunfounded accusations born of an unhealthy
    obsession.\u201D \n\nAEGIS has also shared reports of unmarked vessels transiting
    between the Ihilakken and Kimotoro constellations. They believe these are vessels
    under Vanguard command. The Caldari Navy has, however, informed the Scope that
    it has evidence that these transits are nothing more than conventional smugglers,
    and that local megacorp security forces are handling the matter.\n\n![Starkmanir
    Gathering](//images.ctfassets.net/1gqwxa4vbed9/3rVBhZd8hv3cOpYWR9j67K/d11cfbbe20801af18f471c26763112d4/Starkmanir_Gathering.png)\n*Starkmanir
    Settlers gather in Amo.*\n\n### Minmatar and Amarr Make Campaign Progress\nFor
    the past two weeks, hopeful Starkmanir have begun to gather at the Republic\u2019s
    military headquarters in Amo. Along with volunteer escorts from the other Matari
    tribes, these would-be settlers have put their faith in the Republic\u2019s promise
    to restore their lost homeworld. \n\nArzad II, once known as Starkman Prime, has
    been under Amarr control since they conquered the Minmatar worlds almost 900 years
    ago. At the time, the Starkmanir were the largest and most influential of the
    Matari tribes. Now they are by far the smallest. Today most Starkmanir live on
    land granted to them on Matar; a return to their lost home would be a chance for
    the Starkmanir to take a step back towards their lost glory. \n\nEven if the ongoing
    Republic campaign succeeds, the resettlement will not be easy. The planet was
    transformed into a barren world when the Amarr bombarded it in response to a Starkmanir
    rebellion. The Starkmanir gathering in Amo remain undeterred by the prospect of
    a difficult resettlement. According to one would-be settler, \u201CStarkman Prime
    is our home. We will restore it, and it will restore us.\u201D\n\n![Amarr Family
    Station](//images.ctfassets.net/1gqwxa4vbed9/bMp4jDs3vJNAeXWnTgTf0/d7950524591ab10c2853383d247d78cc/Amarr_Family_Station.png)\n\nAs
    the Starkmanir prepare for their hopeful Restoration, the Amarr have finally begun
    the construction of the Deaconry of Economic Oversight at the Emperor Family station
    in Amarr. The Deaconry is a cornerstone of Empress Catiz I\u2019s Blessed Exchange
    plan for economic reform. \n\nThe Amarrian campaign has so far not gathered the
    same level of support as the other empires, and the beginning of construction
    work marks a meaningful milestone in their efforts. Captain Marshal Sirdan xer
    Qosh, who has been leading efforts to garner capsuleer support, has called the
    construction \u201Ca historic moment that our descendants are sure to learn about
    one day,\u201D adding that \u201Cthis is the beginning of a new vision for the
    prosperity of our great Empire.\u201D\n\n### News in Brief\n- Starkmanir Chief
    Jeoran Setul honors capsuleer Bixtarqi\u2019s contribution to Restoration campaign
    as \u201CStarkman Legend\u201D.\n\n- Capsuleer Remilia Malitia granted title of
    \u201CCorridor Architect\u201D by Syndicate campaign oversight committee due to
    unmatched contributions.\n\n- Capsuleer Ceyriot first \u201CDeacon of the Exchange\u201D
    to be named due to overwhelming contributions to Amarr campaign for economic reform.\n\n-
    Federation scientists cite capsuleer Paunch Gigabyte as an \u201COperational Mastermind\u201D
    in first paper to be published based on Operation Rogue Edge contributions.\n\n-
    Amarr prepare to celebrate ten years of Empress Catiz I reign next month with
    tributes from across the Empire.\n\n- President Alix Moreau confirms reports of
    new, deadlier Rampant Drone Fabricators being spotted in Anoikis systems.\n\n-
    Capsuleers of No Vacancies are first to master all 100 waves of Rampant Drone
    Fabricator's assault.\n\n- Arzad II naming rumored to be one of many sticking
    points in ongoing CONCORD negotiations.\n\n- Ymir and Salvation-class ships sighted
    in battle as capsuleers add command carriers to doctrines.\n\n- Upwell consortium
    recoups losses from Vanguard raid in massive insurance payout by Intaki Bank.\n\n-
    AIR\u2019s latest holotech licensed to NOH for use at entertainment parks.\n\n-
    After over a decade, F.U.N. Inc convenes 450th open fleet."
