- body: "![Sanctified Vidette](//images.ctfassets.net/1gqwxa4vbed9/3IbSogyEasFw3a9pGpIKZE/d817941a137d9883573d6601aef66ef6/Sanctified_Vidette.png)\n*Sanctified
    Vidette Research Facility, origin of Conquest research.*\n### Conquest Revealed
    and Banned\nA long-running series of Inner Circle sessions has come to an end
    with an agreement not to activate a theoretical technology. The technology in
    question is called \u201CConquest\u201D. Based on Drifter Hyperspace Network research,
    Conquest devices could be the most powerful weapons ever developed, even though
    they do not involve the firing of any shots or dropping of any bombs. That is
    because Conquest technology unlocks the power to take control of an entire star
    system at once.\n\nConquest is extrapolated from Drifter hyperspace communication
    technology, the same technology believed to have been used to damage the gates
    surrounding Jita earlier this year. These devices, known as \u201CConquest Engines\u201D,
    would require significant time to configure to local variables, but once activated
    would send out a pulse across hyperspace that executes a higher-dimensional cyber
    attack on every military complex and planetary defense grid within the gravity
    well of a star. This will grant the group in control of the activated device total
    control over the system for an extended period of time before conventional warfare
    can resume in the area.\n\nThe Amarr were the first major faction to begin investigating
    the theoretical possibility of Conquest technology, but shortly thereafter, the
    Caldari and Minmatar redirected their own Drifter Technology research programs
    towards developing their own devices. According to Head of Inner Circle Irhes
    Angireh, \u201CCONCORD became aware of these research programs in late September.
    We immediately called for an Inner Circle meeting to try and negotiate the ban
    that is being announced today\u201D.\n\nCONCORD\u2019s swift action was a result
    of concerns raised by their own science teams over the possible collateral damage
    these Conquest Engines could unleash. Conquest by design is about control rather
    than destruction. However, it is a brute-force communication attack that extends
    down from higher dimensions in a controlled collapse guided by gravitational forces,
    requiring extremely complex engineering and relying on a connection to the poorly
    understood Drifter Network. In space, theoretically, it should have minimal interference
    and be able to pinpoint its intended targets. Deep within local gravity wells,
    such as those around large moons or planets, any system could be at risk.\n\nThat
    means airborne transports could fall out of the sky, entire cities could suddenly
    go offline, or even medical facilities could fail. CONCORD estimates that within
    the average warzone system, tens of thousands of civilian lives could be lost
    after every Conquest attack. Losses would be exponentially higher within more
    populated systems. Shielding infrastructure from these attacks is beyond any known
    current technology. In fact, the only theorized method for stopping a Conquest
    Engine is another Conquest Engine.\n\nAngireh has stated that, \u201CIt was a
    hard-fought agreement, but all four Empires have signed a pact stating that they
    will not deploy any Conquest device first in a conflict.\u201D The specificity
    of this wording was the result of weeks of negotiations. In theory, no empire
    can ever deploy a Conquest Engine so long as this agreement holds; however, it
    also means that the moment one empire deploys a device, it opens the way for all
    others to deploy their own. Political pundits have called this a \u201Ctenuous
    agreement at best\u201D, and many fear it is only a matter of time before this
    dangerous technology changes the nature of war forever.\n\nNo one is more aware
    of the dangers of this future than the Gallente Federation. As the only major
    power without control over a Drifter wormhole system, the Federation is unable
    to develop any technologies based on the Drifter Hyperspace Network. If the Caldari
    State were to field a Conquest Engine unopposed, the Gallente would be defenseless.
    When asked about the potential threat, President Alix Moreau told the Scope, \u201CThis
    technology is extremely dangerous. There is no denying that when faced with the
    facts.\u201D When asked how they planned to deal with a potential Conquest attack,
    they responded, \u201CWe cannot disclose the nature of our operations at this
    time. The Federation is entering a golden age of innovation, and we will stop
    at nothing to develop the means our people need not only to survive, but to flourish.\u201D\n\n###
    The Origin of Conquest\nThe theory behind Conquest technology was first developed
    by a young but already lauded Amarrian scientist, Choralmaster Sitareh Lex. She
    is part of a little-known order of empirical-theologians called The Chorus of
    the Echoing Word. Made up of experts from Hedion University and the Royal Amarr
    Institute, as well as members of the Council of Theology, these empirical-theologians
    are dedicated to scientific study as a path to revealing sacred truth. Their name
    itself reflects a religious perspective on a scientific event. The Echoing Word
    holds that our universe began with the first word of God, and that reality as
    we know it is but the echoes of that word. This is a description of the event
    secular scientists would call the Big Bang.\n\nSitareh Lex was part of the science
    team that first experimented with the Drifter Network in Sanctified Vidette following
    the resolution of the Drifter Crisis. That research led her to write a paper,
    which she submitted for publication on YC128.09.21. In this paper, she described
    how the communication capabilities of the network could be guided by the deformation
    of space caused by gravity. It also broke down how the Jita incident had demonstrated
    that it would be a simple matter to overpower complex devices.\n\nThe paper was
    not approved for publication and was quickly flagged as classified intelligence
    by the Royal Amarr Institute, which passed it on to the high commanders of the
    Imperial Navy and the Empress herself. Working with Lex, they reworked her theories
    into a practical military framework they codenamed \u201CConquest\u201D. \n\nDespite
    the initial paper never being published, rumors of the theoretical framework behind
    it began to circulate. It was not long before the Caldari and Minmatar began working
    on their own versions of the project in their respective Drifter wormholes. With
    all of this activity, it was inevitable that CONCORD would become aware of the
    research and seek to intervene.\n\nWith Conquest technology now revealed, Sitareh
    Lex\u2019s involvement has also become public knowledge. Reactions to her have
    been varied, with some reviling her as a villain responsible for unleashing untold
    destruction, and others celebrating her as New Eden\u2019s first hyperspace genius.
    She is known to have found great favor with Captain Marshal Xer Qosh, who has
    called her \u201Cblessed with the Lord\u2019s true vision.\u201D She is even known
    to have been summoned to numerous private meetings with the Empress herself. \n\nBorn
    a commoner and raised in a backwater holding in Anath, Lex could not have grown
    up further from the seat of power in the Empire. Her sudden rise to prominence
    is rumored to be a source of unrest amongst the Holders, while it is causing her
    to quickly gain popularity amongst her fellow commoners. \n\nWhen interviewed,
    Lex refuses to comment on political matters. She told the Amarr Certified News,
    \u201CI am a humble student of our Lord\u2019s creation. All I have done is reveal
    one fraction of its glory, great and terrible as it may be.\u201D\n\n### News
    in Brief\n- New swathe of Federation Rogue Drone research facilities pushed through
    by Presidential Executive Order.\n\n- Totality Day celebrated with destruction
    as battle against Blood Raider assault continues.\n\n- SOCT\u2019s Matshi Raish
    rumored to have abstained from Conquest tech Inner Circle vote.\n\n- Hetman General
    Filmir assures Republic clans \u201CConquest is only a deterrent\u201D.\n\n- Provost
    Marshal Valkanir on unpaid leave amidst closed-door EDENCOM investigation.\n\n-
    Executive General Torigo blames Conquest tech ban on \u201CGallente cowardice\u201D.\n\n-
    Battle in Obe between Snuffed Out and Winter Co leads to destruction of 35 titans.\n\n-
    First Vanquisher lost since YC126 after Kalayavan Medellin taken down by 748 pilots.\n\n-
    Turboencabulator Repairman led battle logistics efforts with 996,299 HP repaired.\n\n-
    JADE DRAG0NESS's Avatar led destruction efforts with 4.15M HP damage dealt."
