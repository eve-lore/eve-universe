- body: "![Operation Success](//images.ctfassets.net/1gqwxa4vbed9/7C6HorYDFY3sVt62N8mQWY/fda2dc81e265da7e1aaae664b4c25de4/Operation_Success.png)\n*Capsuleers
    celebrate the completion of Operation Rogue Edge in Dodixie.*\n\nCapsuleers flooded
    into Dodixie yesterday to celebrate the success of Operation Rogue Edge. This
    makes the Gallente effort the first military campaign to be as a confirmed success.
    16,903 capsuleers worked together to support the operation, a massively ambitious
    research project that aims to make use of Rogue Drone technology to unlock industrial
    improvements.\n\nThe success was confirmed by the unveiling of the EDG-0, the
    first working industrial prototype with integrated Rogue Drone technology. The
    EDG-0 (Excavator Drone Generation-Zero) is the first Drone designed by humans
    with functional components developed through Rogue Drone iteration. Thanks to
    the contributions of capsuleers, not only has the EDG-0 been a success, but CreoDron
    and the Federation Navy are already preparing an industrial-scale rollout of production
    models this November. Vice-Admiral Foriana Revelli, who oversaw Operation Rogue
    Edge, told crowds gathered at the unveiling that this was \u201Ca victory for
    democratic development. Loyal capsuleers have come together with the military
    and our CreoDron partners to innovate our way into a brighter tomorrow.\u201D\n\nThe
    EDG-0 contains iterative Rogue Drone improvements that unlock superior performance.
    The development of the drone was overseen by President Alix Moreau herself, in
    cooperation with CreoDron CEO Roni Darieux. Though this is not the first time
    Rogue Drone parts have been used by human engineers, it will be the first time
    that their developments have been retrofitted into a drone as fully functional
    components. \n\nHowever, according to Roni Darieux, the real victory is not in
    the drone itself but the process by which it was developed. Darieux, a descendant
    of the legendary Old Man Darieux and a noted roboticist in his own right, told
    reporters that \u201Cthe true innovation that has been unlocked, thanks to President
    Moreau and the thousands of capsuleers who supported her plan, is the use of Rogue
    Drone Hives as \u2018Wild Laboratories\u2019. We can now observe these hives for
    useful adaptations, then capture specimens in order to extract those innovations
    and integrate them into our own technology. This unlocks access to the incredible
    iterative power of Rogue Drones and promises to supercharge the Federation's industrial
    future.\u201D According to the Federation Navy and CreoDron, the first project
    to benefit from these industrial improvements will be the new Stargate connection
    planned between Renyn and Jufvitte. \n\nRogue Drones are relentless iterators,
    capable of adapting at a much faster rate than human engineering. However, this
    iteration is part of what makes them so hard to control, as any attempt to limit
    their intelligence will be optimized out. Dissenters have raised fears over the
    potential impact of this technology. Former presidential candidate Senator Lucas
    Tenzin told the Scope that he fears \u201Cthe brazen application of technology
    we understand so little, let alone the potential impact of increased automation
    on the labor rights of Federation citizens.\u201D\n\nIn addition, scientists outside
    the Federation at the School of Applied Knowledge and Hedion University have shared
    concerns with the Scope. These concerns center around the possible transfer of
    infestations through the low-level protocols that manage the components that have
    been integrated into the EDG-0. The digital minds of Rogue Drones have drifted
    far away from the original human programs that gave rise to them. As such, little
    is known about the deep operations of their minds and how these connect to their
    working parts.\n\nIn response, President Moreau has assured the Gallente people
    that \u201Cyour well-being is the ultimate goal of any innovations this administration
    invests in. We do not know everything; unfortunately, we never will, but what
    we understand today is more than we did yesterday. That frontier of understanding
    is a horizon we must forever reach beyond. Today is an unmitigated success for
    our collective ability to innovate when we are allowed to dream without limits.\u201D\n\n###
    News In Brief\n- Minmatar push resolution to reclassify Arzad as Starkman as key
    to ongoing CONCORD negotiations.\n\n- Closed hearing held by EDENCOM over accusations
    at Provost Marshal Kasiha Valkanir\u2019s handling of Avalon incident.\n\n- Society
    of Conscious Thought invites scientists throughout New Eden to investigate irregular
    hyperdimensional data.\n\n- Amarrian order of empirical-theologians make a stir
    in scientific community with new paper on \u201Cbrute force mass projections through
    higher-dimensional communications.\u201D\n\n- Executive General Heika Torigo declares
    Syndicate is at breaking point following successful raid on black market communications
    hub.\n\n- Farokh Khanid holds celebration of Imperial prosperity in honor of Blessed
    Exchange economic plan. \n\n- Intaki Bank executives meet with Caldari Business
    Tribunal to negotiate future standing."
