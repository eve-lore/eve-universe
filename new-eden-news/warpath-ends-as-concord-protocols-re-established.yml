content:
- body: "![AIR station under construction](//images.ctfassets.net/1gqwxa4vbed9/KPxEDkLfK0OPgEAQCIoEE/f79e539490a3e0acd8eea569132b17aa/AIR_station_under_construction.png)\nWarpath
    has been purged from CONCORD's security protocols. After the purge, CONCORD\u2019s
    rapid response fleets immediately began arriving at empire fleet maneuveures,
    stopping engagements before they could begin. Navy fleets have been forced to
    withdraw back to designated warzones. This has brought a swift end to the conflict
    that began when a cyberattack disabled CONCORD\u2019s ability to respond to large
    scale empire attacks. \n\nThis morning, CONCORD\u2019s security teams were finally
    able to isolate the last of Warpath\u2019s points of ingress into their systems.
    It has been impossible to trace Warpath\u2019s origin, but with CONCORD\u2019s
    protocols no longer exposed any further attacks of this nature should be impossible.\n\nDespite
    the speed with which CONCORD has been able to re-establish order, the strain caused
    by the Warpath conflict remains. The cost and destruction of Titan scale battles
    in high security space has brought fear to communities that had grown used to
    relative security. The economic impact has also been significant, with the rush
    to produce defence networks and new warfare grids taking over significant portions
    of national industry. Military spending during Warpath is estimated to have spiked
    to 300% of normal, as many assets that the empires keep in reserve were lost in
    active combat and had to be swiftly replaced.\n\nFollowing the withdrawal of their
    militaries, leaders of the four empires have agreed to to a meeting of the Inner
    Circle as next steps are discussed. CONCORD has pushed for a return to diplomacy
    and AIR has agreed to host a special session in the newly opened system of Manifest,
    Exordium. Delegates from the empires are already congregating in Exordium\u2019s
    embassy systems in order to draft new diplomatic agreements ahead of the summit.
    With the recent wave of destruction so fresh in the minds of all participants,
    political commentators hold little hope for a return to normalcy any time soon.\n\n###
    News in Brief\n- Militia communication agencies rush into production as Empires
    expected to announce new military strategies post-Warpath.\n- New prototype Navy
    Destroyers believed to have clocked over 700 capsuleer kills and suffered approximately
    150 losses during Warpath period.\n- Imperial economists gather at Royal Palace
    at Empress' behest.\n- 250B ISK Dreadnought brawl in Dal as capsuleers engage
    in open conflict.\n- Capsuleer led Circle of Vheroka plans to host art exhibition
    for upcoming liberation day celebrations.\n- Starkmanir tribe invited to lead
    heritage activities across the Republic in lead up to Liberation day.\n- President
    Moreau praises patriotic creativity as ship parade in Dodixie planned for Federation
    day. \n"
