- body: "![Ansiblex and Squall](//images.ctfassets.net/1gqwxa4vbed9/jzE1oNbjolIedMDUkIvcL/33e622caff7d2f60ecdd937227fa9233/Ansi.png)\n###
    Upwell Stock Plummets After Hyperdimensional Shift\nThe stock prices of many Upwell
    Consortium members have plummeted as stockholders panic in response to the recent
    Ansiblex Jump Bridge changes. Propel Dynamics and Zoar and Sons have been hit
    particularly hard by the market panic, with bottoming-out stock market values
    and rumors of contract cancellations.\n\nThe Upwell Consortium has responded by
    releasing an official statement explaining that, \u201CThese changes were a necessary
    result of a permanent shift in the hyperdimensional topography surrounding New
    Eden. Our engineering teams responded admirably, updating the entire network to
    a new framework with record-breaking speed.\u201D\n\nThis Hyperdimensional Shift,
    as it has become known, has been confirmed by independent scientific observers.
    Ansiblex Jump Bridges, like stargates, make near-instantaneous travel across space
    possible by tunneling through higher dimensions of space, or hyperdimensions.
    A sudden and significant change has occurred in the relationship between those
    higher dimensions and three-dimensional space around both New Eden and Anoikis.
    Little is understood about the higher dimensions, and the cause of the Shift remains
    a mystery.\n\nStargates, which use stable gravitational resonance to anchor the
    artificial wormholes they generate, have been unaffected by the change. According
    to Upwell, Ansiblex Jump Bridges were unable to establish stable connections through
    the shifted hyperdimensions. To allow the Ansiblex to continue to operate, a stabilizing
    connection to a central solar system was necessary. Even with this change, the
    power requirements of jumps have increased, resulting in significant strain on
    Ansiblex capacitors.\n\nAlexander Ducasse, President of EverMore and CEO of the
    Consortium member Interbus, has criticized Upwell\u2019s handling of the situation.
    He has called for an inquest into the changes. Ducasse told reporters, \u201CAre
    we truly to believe there were no warning signs that this Shift was coming? All
    of us who have invested in the Consortium deserve to know what happened if we
    are to continue putting our faith in the Upwell brand.\u201D\n\n![SOCTIdemi](//images.ctfassets.net/1gqwxa4vbed9/6w6wY6QnfS0WETLJ9vOU8l/ec9252f8e2c22f5a283f4e218734ae80/SOCTIdemi.png)\n*Left:
    An SOCT Praxis observed in a Sleeper Site post-Shift. Right: Idemi Sver, CEO of
    the SOCT.*\n\n### SOCT Cancels Conference Amidst Shift Silence\n\nThe unexplained
    changes in hyperdimensional topography have had an impact beyond Upwell infrastructure.
    Reports have begun flooding in from Sisters of Eve science teams of changes to
    class 1-3 star systems within Anoikis. Sleeper sites have reconfigured into new
    positions, and their surrounding environment has dramatically changed. As of yet,
    the higher wormhole systems remain unaltered, but EDENCOM intelligence teams are
    also reporting fluctuations in Pochven. Abyssal energies within the region have
    become unstable, and there is increased activity from resident entities.\n\nPrior
    to the Shift, the CEO of the Society of Conscious Thought (SOCT) Idmei Sver had
    called for a public scientific conference to discuss abnormal hyperdimensional
    telemetry observed by the Society. This conference was called off suddenly at
    the same time as the Shift occurred. Scientists who were already en route to FDZ4-A
    in Geminate had to turn around without any explanation from the SOCT. According
    to those who spoke with The Scope, many have demanded an explanation from the
    Society, but they have so far received no response. The SOCT has a long history
    of refusing to share information with the wider world that dates back to its founding
    as a Jovian organization. Though the Jove disappeared 11 years ago and the SOCT
    took up their seat in CONCORD\u2019s Inner Circle, many are suspicious of what
    secret Jovian knowledge the Society keeps hidden from the wider cluster.\n\nToday,
    Sver issued a statement that \u201CSociety matters have taken precedence,\u201D
    with no further explanation as to what those matters might be. The Scope reached
    out to the SOCT to ask if the cancellation had any connection to the Hyperdimensional
    Shift. We received a response stating that \u201Cmatters of stability are always
    of interest to the Society. We will continue to monitor the situation.\u201D\n\n###
    News in Brief\n\n- Spike reported in Rampant Fabricator destructions as capsuleers
    compete for fastest 100 cycles.\n\n- SOCT denies knowledge of anonymous Anoikis
    \u201Cphantom messenger\u201D.\n\n- Minmatar Republic makes massive investment
    in secret project based in Liberated Barbican.\n\n- Primal Instinct corporation
    plans mass destruction in Amamake on 26th of September in honor of successful
    solar rotation.\n\n- Paladin and Golem-class ships refitted after spacetime anomalies
    result in artificial mass spikes.\n\n- Kaalakiota, LaiDai, and Ishokone research
    teams establish rare joint operation in Conflux Eyrie.\n\n- Chairman Akimaka Saraki
    meets with Syndicate leaders in Poitot to discuss future cooperation.\n\n- Syndicate
    prepares for influx of Capsuleers on September 26th when \u201CDMZ\u201D festival
    begins.\n\n- EDENCOM deploys additional Pochven strike teams to counter rising
    threats.\n\n- Thukker Chief Ennar Aeboul calls for Tribal Council meeting to discuss
    impacts of Hyperdimensional Shift.\n\n- Empress Catiz I rumored to have made secret
    visit to Imperial Academy."
