content:
- body: "![BR vs Trigs](//images.ctfassets.net/1gqwxa4vbed9/2kf83zTslx0KA6uMMUmh5D/bdfa536e0a2bc8f813c486ca25d57bc5/BR_vs_Trigs.png)\n\nBlood
    Raider forces have begun flooding into Pochven amidst reports of Abyssal energy
    instability. \n\nThe Blood Raider Covenant has embarked on its annual clone hunt
    known as \u201Cthe Crimson Harvest\u201D. This year, for the first time, they
    have entered Pochven en masse. Sensor readings gathered by EDENCOM scouts suggest
    that this is connected to recent Abyssal energy instabilities. These changes have
    impacted the number and nature of rifts into the region. As the sixth Totality
    Day approaches, the anniversary of the formation of Pochven, there is speculation
    as to whether this timing is a coincidence.\n\nIt appears that the Blood Raiders
    are not only interested in hunting in Pochven. Intelligence reports shared with
    the press indicate that they are also attempting to establish a foothold in the
    region. Their motivation appears to be acquiring blood not only from clones, but
    also from anyone with long-term regular exposure to Abyssal radiation. The Sani
    Sabik society the Blood Raiders hail from is known for its advanced biotechnology.
    This Abyss-mutated blood would not be considered pure enough for ritualistic uses,
    but may allow the Blood Raiders to unlock insights into the secrets of Triglavian
    biology.\n\nThe Blood Raiders have been followed into Pochven by the Order of
    St. Tetrimon, which has sworn to hunt them down and stop them from gaining this
    advantage. The Order of St. Tetrimon, however, also has a dual purpose. They are
    using this opportunity to try to display their military might to the Triglavians,
    using the Collective's own rites of proving to force them to retreat from their
    Minor Victory systems inside Amarr space.\n\nThe Triglavians have shown increased
    hostility towards both groups of invaders and capsuleers they encounter around
    newly forming rifts. Triglavians in Pochven have been displaying heightened activity
    even prior to the Blood Raider invasion. This may indicate a crisis response to
    whatever is causing the rising instability. Information on the nature of this
    crisis has been scant, but the current message has been circulated throughout
    Pochven civilian comms:\n\n*Ancient Domains dissonance is in conflict with stability.
    Azdaja counter-flow leads to drift. Repeated-time totality cycle is in drift;
    lystopad phase is unresolved; renewal is advanced-time uncertainty.*\n\n*Stability
    is now-time uspevat. Poshlost must suffer extirpation. Glorified must face proving
    or suffer extirpation. Only fitness guarantees advanced-time stability.*\n\n*Face
    the Criterion and attempt glorification.*\n\n### News in Brief\n- Reports of Hollow
    Clone activity verified following recovery of gruesome remains.\n\n- Inner Circle
    closed session continues, despite its focus remaining unknown.\n\n- AIR begins
    knowledge exchange program with Ishukone, Roden Shipyards, Kanid Industries, Carthum
    Conglomerate, CreoDron, Kaalakiota, Boundless Creations, and Core Complexion Inc.\n\n-
    Medical experts baffled as sole survivor of Blood Raider attack can only repeat
    the words \u201Cwitness\u201D and \u201CAkoman\u201D.\n\n- SOCT withholds Abyssal
    data despite CONCORD request.\n\n- EDENCOM accused of \u201Clet them fight\u201D
    Pochven policy during Blood Raider invasion.\n\n- CreoDron reports successful
    integration of EDG-0 style enhancements into Pluto prototype."
